# Zone de limitation : protège le login contre le bruteforce (10 req/min/IP).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# Zone générale API : garde-fou contre les abus (30 req/s/IP en rafale 60).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

upstream backend_api {
    server backend:8080;
    keepalive 16;
}

upstream frontend_app {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;   # uploads de pieces justificatives

    # Masque la version de nginx dans les reponses et pages d'erreur.
    server_tokens off;

    # Delais raisonnables : evite les connexions zombies.
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # ── En-tetes de securite ────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Force re-resolution DNS Docker (evite le 502 apres redemarrage des upstream)
    resolver 127.0.0.11 valid=5s;

    # Login : rate limiting strict anti-bruteforce.
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend_api/api/auth/login;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Flux de notifications en temps reel (SSE) : connexion HTTP longue,
    # a exempter du buffering (sinon le navigateur ne recoit les evenements
    # qu'une fois le tampon nginx plein) et du timeout de lecture court
    # applique au reste de l'API.
    location /api/notifications/stream {
        proxy_pass              http://backend_api/api/notifications/stream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Authorization     $http_authorization;
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding off;
        proxy_read_timeout      3600s;
    }

    # API Spring Boot (context-path /api)
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        proxy_pass         http://backend_api/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
    }

    # Frontend Nuxt 3 (SSR + WebSocket pour temps reel)
    location / {
        proxy_pass         http://frontend_app/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
