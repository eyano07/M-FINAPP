# Zone de limitation : protège le login contre le bruteforce (10 req/min/IP).
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;
# Zone générale API : garde-fou contre les abus (30 req/s/IP en rafale 60).
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;

# ── Redirection HTTP -> HTTPS ─────────────────────────────────────────────
# Le challenge ACME (renouvellement Certbot) doit rester accessible en clair :
# c'est la seule route qu'on ne redirige pas.
server {
    listen 80;
    server_name votre-domaine.cd;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name votre-domaine.cd;
    client_max_body_size 25m;   # uploads de pieces justificatives

    # Chemins standards Certbot (volume monte depuis l'hote, voir
    # docker-compose.prod.yml). Remplacer "votre-domaine.cd" ci-dessus ET
    # dans ces deux chemins par le vrai nom de domaine.
    ssl_certificate     /etc/letsencrypt/live/votre-domaine.cd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.cd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Suites modernes uniquement (recommandation « intermediate » de Mozilla) :
    # plus de CBC en TLS 1.2 (audit sécurité du 05/10/2026, S-04).
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Masque la version de nginx dans les reponses et pages d'erreur.
    server_tokens off;

    # Delais raisonnables : evite les connexions zombies.
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    # ── En-tetes de securite ────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Politique de contenu (audit sécurité du 05/10/2026, S-08/S-24) : ressources
    # du seul domaine de l'application ; blob: pour l'aperçu des PDF et pièces
    # jointes ; 'unsafe-inline' exigé par Nuxt (script de configuration) et
    # Vuetify (styles en ligne).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; media-src 'self' blob:; worker-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    # HSTS : force le HTTPS pour les visites suivantes. N'activer qu'une fois
    # le certificat stable — un HSTS mal configure est difficile a annuler
    # tant que le navigateur du visiteur n'a pas expire le max-age.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Resolveur DNS Docker : n'a d'effet que combine a un proxy_pass base sur
    # une variable (voir plus bas). Un bloc upstream{} avec un nom d'hote
    # statique ("server backend:8080;") resout ce nom UNE SEULE FOIS au
    # demarrage de nginx et ignore silencieusement ce resolver — c'etait le
    # bug initial : recreer un conteneur backend/frontend (nouvelle IP sur le
    # reseau Docker) laissait nginx router vers l'ancienne IP -> 502 jusqu'a
    # un redemarrage manuel de nginx.
    resolver 127.0.0.11 valid=5s;

    # Login : rate limiting strict anti-bruteforce.
    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        limit_req_status 429;
        # Pas de chemin apres la variable : avec un proxy_pass base sur une
        # variable, nginx ne fait JAMAIS la substitution prefixe-de-location
        # -> reste-de-l'URI qu'il fait avec une cible statique. Une valeur
        # fixe ici (ex. "/api/auth/login") serait envoyee telle quelle pour
        # CHAQUE requete de ce bloc, quel que soit le chemin reellement
        # demande. Sans chemin du tout, nginx transmet l'URI d'origine
        # verbatim - ce qui tombe juste ici car le prefixe de location et le
        # context-path Spring (/api) coincident deja.
        set $backend_upstream backend:8080;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Flux de notifications en temps reel (SSE) : connexion HTTP longue,
    # a exempter du buffering (sinon le navigateur ne recoit les evenements
    # qu'une fois le tampon nginx plein) et du timeout de lecture court
    # applique au reste de l'API.
    location /api/notifications/stream {
        # Voir le commentaire de /api/auth/login : pas de chemin apres la
        # variable, sinon il ecraserait l'URI d'origine pour cette location.
        set $backend_upstream backend:8080;
        proxy_pass              http://$backend_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Authorization     $http_authorization;
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding off;
        proxy_read_timeout      3600s;
    }

    # API Spring Boot (context-path /api)
    # Lecture d'un releve bancaire par l'IA (rapprochement) : un releve de
    # plusieurs pages peut demander jusqu'a 3 minutes de traitement.
    location /api/rapprochements/extraction {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        # Voir le commentaire de /api/auth/login : pas de chemin apres la
        # variable, sinon il ecraserait l'URI d'origine pour cette location.
        set $backend_upstream backend:8080;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout      240s;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        limit_req_status 429;
        # Voir le commentaire de /api/auth/login : pas de chemin apres la
        # variable, sinon il ecraserait l'URI d'origine pour cette location.
        set $backend_upstream backend:8080;
        proxy_pass         http://$backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
    }

    # Frontend Nuxt 3 (SSR + WebSocket pour temps reel)
    location / {
        # Voir le commentaire de /api/auth/login : pas de chemin apres la
        # variable, sinon il ecraserait l'URI d'origine pour cette location.
        set $frontend_upstream frontend:3000;
        proxy_hide_header  X-Powered-By;
        proxy_pass         http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
