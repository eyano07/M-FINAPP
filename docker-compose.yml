services:
  db:
    image: postgres:16-alpine
    container_name: mbsc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbsc}
      POSTGRES_USER: ${POSTGRES_USER:-mbsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbsc_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbsc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mbsc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mbsc}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mbsc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mbsc_secret}
      # Aucune valeur de repli : un JWT_SECRET absent doit faire echouer le
      # demarrage, pas retomber silencieusement sur une cle connue publiquement
      # (elle permettait de forger un jeton ROLE_ADMIN hors ligne).
      APP_JWT_SECRET: "${JWT_SECRET:?JWT_SECRET est obligatoire - generer avec openssl rand -base64 48}"
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      APP_SEED_ENABLED: ${SEED_ENABLED:-false}
      APP_SEED_PASSWORD: ${SEED_PASSWORD:-}
      # Prive par defaut : cette variable etant toujours transmise, elle
      # ecrasait le durcissement du profil prod (app.swagger.public=false) et
      # laissait /v3/api-docs accessible sans authentification.
      # Mettre SWAGGER_PUBLIC=true dans .env pour l'ouvrir en developpement.
      APP_SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      APP_IA_ENABLED: ${IA_ENABLED:-true}
      APP_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Copie e-mail des notifications (secours : l'administrateur saisit normalement ces valeurs dans l'application).
      APP_PUBLIC_URL: ${PUBLIC_URL:-}
      APP_MAIL_ENABLED: ${MAIL_ENABLED:-false}
      APP_MAIL_HOST: ${MAIL_HOST:-}
      APP_MAIL_PORT: ${MAIL_PORT:-587}
      APP_MAIL_USERNAME: ${MAIL_USERNAME:-}
      APP_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${MAIL_FROM:-}
      APP_AUDIT_DIR: /app/data/logs
      APP_PUSH_COMPTE_SERVICE: ${PUSH_COMPTE_SERVICE:-/app/secrets/firebase-compte-service.json}
      # Chiffrement des cles d'API de l'IA saisies dans l'application (openssl rand -base64 32).
      APP_SECRETS_KEY: ${SECRETS_KEY:-}
    volumes:
      - backend_uploads:/app/data/uploads
      - backend_logs:/app/data/logs   # journal d'audit (audit.log) : a sauvegarder et a conserver
      # Cle du compte de service Firebase (notifications push de l'application Android), hors depot : facultative.
      - ./secrets:/app/secrets:ro
    expose: ["8080"]
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Spring Boot + Hibernate + migrations : jusqu'a 2 minutes sur un portable. Pendant cette periode un echec de la
      # sonde n'est pas compte (meme reglage que docker-compose.prod.yml).
      start_period: 300s

  frontend:
    build:
      context: ./frontend-web
      network: host
    container_name: mbsc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: /api
    expose: ["3000"]
    networks: [mbsc-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: mbsc-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Application Android à télécharger (page À propos) : APK déposé à la main, jamais dans le dépôt.
      - ./telechargements:/usr/share/nginx/telechargements:ro
    networks: [mbsc-net]

  # ---------------------------------------------------------------------------------------------------------------
  # M-FINAPP Hôtellerie (PMS), profil « pms » : docker compose --profile pms up -d
  # Une application à part (sa base mbsc_pms dans le même conteneur de base), reliée à M-FINAPP par une clé
  # d'appairage : Administration › Hôtellerie (adresse de ce serveur et port PMS_PORT, 8090 par défaut).
  # Variables du .env : PMS_DB_PASSWORD, PMS_LECTEUR_PASSWORD, PMS_SECRETS_KEY (voir pms/README.md).
  # ---------------------------------------------------------------------------------------------------------------
  pms-init:
    image: postgres:16-alpine
    container_name: mbsc-pms-init
    profiles: [pms]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      POSTGRES_DB: ${POSTGRES_DB:-mbsc}
      POSTGRES_USER: ${POSTGRES_USER:-mbsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbsc_secret}
      PMS_DB_PASSWORD: ${PMS_DB_PASSWORD:-}
      PMS_LECTEUR_PASSWORD: ${PMS_LECTEUR_PASSWORD:-}
    volumes:
      - ./pms/init/init-pms.sh:/init-pms.sh:ro
    entrypoint: ["sh", "/init-pms.sh"]
    restart: "no"
    networks: [mbsc-net]

  pms-backend:
    build: ./pms/backend
    image: appfin-pms-backend:latest
    container_name: mbsc-pms-backend
    profiles: [pms]
    restart: unless-stopped
    depends_on:
      pms-init:
        condition: service_completed_successfully
    environment:
      PMS_DATASOURCE_URL: jdbc:postgresql://db:5432/mbsc_pms
      PMS_DATASOURCE_USERNAME: pms_app
      PMS_DATASOURCE_PASSWORD: ${PMS_DB_PASSWORD:-}
      PMS_FINAPP_URL: ${PMS_FINAPP_URL:-http://backend:8080}
      PMS_SECRETS_KEY: ${PMS_SECRETS_KEY:-}
      # Même fuseau que M-FINAPP : heures d'arrivée et de départ des établissements.
      PMS_FUSEAU_HORAIRE: ${APP_FUSEAU_HORAIRE:-Africa/Lubumbashi}
    volumes:
      - pms_uploads:/app/data/uploads   # pièces d'identité des clients
      - pms_logs:/app/data/logs         # journal d'audit de l'hôtellerie : à conserver, jamais à supprimer
    expose: ["8080"]
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/sante || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  pms-frontend:
    build:
      context: ./pms/frontend
      network: host
    image: appfin-pms-frontend:latest
    container_name: mbsc-pms-frontend
    profiles: [pms]
    restart: unless-stopped
    depends_on: [pms-backend]
    environment:
      NUXT_PUBLIC_API_BASE: /api
    expose: ["3000"]
    networks: [mbsc-net]

  pms-nginx:
    image: nginx:1.27-alpine
    container_name: mbsc-pms-nginx
    profiles: [pms]
    restart: unless-stopped
    depends_on: [pms-backend, pms-frontend]
    ports:
      - "${PMS_PORT:-8090}:80"
    volumes:
      - ./pms/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [mbsc-net]

volumes:
  db_data:
  backend_uploads:
  backend_logs:
  pms_uploads:
  pms_logs:

networks:
  mbsc-net:
    driver: bridge
