services:
  db:
    image: postgres:16-alpine
    container_name: mbsc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbsc}
      POSTGRES_USER: ${POSTGRES_USER:-mbsc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbsc_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbsc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mbsc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mbsc}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mbsc}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-mbsc_secret}
      # Aucune valeur de repli : un JWT_SECRET absent doit faire echouer le
      # demarrage, pas retomber silencieusement sur une cle connue publiquement
      # (elle permettait de forger un jeton ROLE_ADMIN hors ligne).
      APP_JWT_SECRET: "${JWT_SECRET:?JWT_SECRET est obligatoire - generer avec openssl rand -base64 48}"
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      APP_SEED_ENABLED: ${SEED_ENABLED:-true}
      # Prive par defaut : cette variable etant toujours transmise, elle
      # ecrasait le durcissement du profil prod (app.swagger.public=false) et
      # laissait /v3/api-docs accessible sans authentification.
      # Mettre SWAGGER_PUBLIC=true dans .env pour l'ouvrir en developpement.
      APP_SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      APP_IA_ENABLED: ${IA_ENABLED:-true}
      APP_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    volumes:
      - backend_uploads:/app/data/uploads
    expose: ["8080"]
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend-web
      network: host
    container_name: mbsc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: /api
    expose: ["3000"]
    networks: [mbsc-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: mbsc-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [mbsc-net]

volumes:
  db_data:
  backend_uploads:

networks:
  mbsc-net:
    driver: bridge
