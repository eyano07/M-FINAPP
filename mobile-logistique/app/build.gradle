plugins {
    id 'com.android.application'
}

// Clé de signature : signature.properties et le fichier .jks restent hors du dépôt (public).
// Les mises à jour de l'APK doivent être signées avec la MÊME clé, sinon Android refuse de les installer.
def proprietesSignature = new Properties()
def fichierSignature = rootProject.file('signature.properties')
if (fichierSignature.exists()) {
    fichierSignature.withInputStream { proprietesSignature.load(it) }
}

android {
    namespace 'cd.mbsc.logistique'
    compileSdk 34

    defaultConfig {
        applicationId 'cd.mbsc.logistique'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    signingConfigs {
        release {
            if (fichierSignature.exists()) {
                storeFile rootProject.file(proprietesSignature['storeFile'])
                storePassword proprietesSignature['storePassword']
                keyAlias proprietesSignature['keyAlias']
                keyPassword proprietesSignature['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig fichierSignature.exists() ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // Scanner de QR (étiquettes des biens) : ZXing, sans les services Google.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Requis par l'écran de capture de ZXing (ContextCompat, ActivityCompat) mais non apporté par la bibliothèque :
    // sans lui, l'application s'arrêtait à l'ouverture du scanner (version 1.0).
    implementation 'androidx.core:core:1.12.0'
}
