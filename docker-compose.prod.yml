services:
  db:
    image: postgres:16-alpine
    container_name: mbsc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbsc}
      POSTGRES_USER: ${POSTGRES_USER:-mbsc}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbsc}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eyano3535/finapp:backend
    container_name: mbsc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mbsc}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mbsc}
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}"
      APP_JWT_SECRET: "${JWT_SECRET:?JWT_SECRET est obligatoire - generer avec openssl rand -base64 48}"
      APP_JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      APP_CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS est obligatoire - ex: https://votre-domaine.cd}"
      # Production : pas de comptes de demo, pas de Swagger public.
      APP_SEED_ENABLED: ${SEED_ENABLED:-false}
      APP_SWAGGER_PUBLIC: ${SWAGGER_PUBLIC:-false}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_IA_ENABLED: ${IA_ENABLED:-true}
      APP_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
    volumes:
      - backend_uploads:/app/data/uploads
    expose: ["8080"]
    networks: [mbsc-net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: eyano3535/finapp:frontend
    container_name: mbsc-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE: /api
    expose: ["3000"]
    networks: [mbsc-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: mbsc-nginx
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [mbsc-net]

  certbot:
    image: certbot/certbot:latest
    container_name: mbsc-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Renouvelle en boucle toutes les 12h (certbot ne renouvelle reellement
    # qu'a moins de 30 jours de l'expiration : cette boucle ne fait rien la
    # plupart du temps). Nginx ne recharge pas seul un certificat renouvele :
    # "docker compose restart nginx" reste necessaire apres un renouvellement
    # (ou un cron externe qui fait les deux).
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  db_data:
  backend_uploads:

networks:
  mbsc-net:
    driver: bridge
